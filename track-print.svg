<?xml version="1.0" encoding="UTF-8"?>
<svg width="2200mm" height="1200mm" viewBox="0 0 2200 1200"
     xmlns="http://www.w3.org/2000/svg">
  <!-- 白色底 220cm × 120cm -->
  <rect x="0" y="0" width="2200" height="1200" fill="#ffffff"/>
  <!-- 左侧半圆弧：A(600,200)→D(600,1000)，向左凸，线宽 18mm -->
  <path d="M 600 200 A 400 400 0 0 0 600 1000"
        fill="none" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
  <!-- 右侧半圆弧：B(1600,200)→C(1600,1000)，向右凸，线宽 18mm -->
  <path d="M 1600 200 A 400 400 0 0 1 1600 1000"
        fill="none" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
</svg>