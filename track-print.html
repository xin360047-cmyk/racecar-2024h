<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>电赛H题赛道</title>
<style>
*{margin:0;padding:0}
body{background:#333;display:flex;flex-direction:column;align-items:center;padding:20px}
svg{background:#fff;display:block}
button{padding:8px 20px;background:#e94560;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;margin-bottom:16px}
.note{color:#aaa;font-size:12px;margin-top:12px;text-align:center;max-width:480px;line-height:1.6}

@media print{
  @page{size:landscape;margin:0}
  body{padding:0;background:#fff;margin:0;width:100%;height:100%}
  svg{width:100%;height:100vh}
  button,.note{display:none}
}
</style></head>
<body>
<button onclick="window.print()">保存 PDF</button>

<svg width="100%" viewBox="0 0 2200 1200" xmlns="http://www.w3.org/2000/svg" style="max-width:800px">
  <rect x="0" y="0" width="2200" height="1200" fill="#ffffff"/>
  <!-- 左弧 向左凸 线宽 18px（对应 SVG 坐标的 18 单位） -->
  <path d="M 600 200 A 400 400 0 0 0 600 1000" fill="none" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
  <!-- 右弧 向右凸 -->
  <path d="M 1600 200 A 400 400 0 0 1 1600 1000" fill="none" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
</svg>

<div class="note">Ctrl+P → 另存为 PDF → 发给打印店<br>
告诉打印店：<b>「等比放大到 220cm×120cm 白色哑光布，线宽对应放大为 1.8cm」</b></div>
</body>
</html>
