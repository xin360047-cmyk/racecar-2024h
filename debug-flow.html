<h2 style="color:#e94560;font-size:20px;margin-bottom:16px;">图1：程序流程图 — main() 主循环 + 状态机</h2>

  <line x1="65" y1="594" x2="22" y2="594" stroke="#30363d" stroke-width="1.5"/>

  <!-- 状态机入口 -->
  <rect x="440" y="50" width="340" height="36" rx="8" fill="#1a122e" stroke="#7c3aed" stroke-width="2"/>
  <text x="610" y="73" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">切换状态(switch)</text>

  <line x1="610" y1="86" x2="610" y2="103" stroke="#30363d" stroke-width="2"/>
  <polygon points="605,103 615,103 610,111" fill="#30363d"/>

  <!-- 判断当前状态 -->
  <rect x="460" y="115" width="300" height="36" rx="8" fill="#1a1a2e" stroke="#58a6ff" stroke-width="2"/>
  <text x="610" y="138" fill="#58a6ff" font-size="13" text-anchor="middle" font-family="sans-serif">switch(g_car_state)</text>

  <line x1="470" y1="151" x2="470" y2="170" stroke="#30363d" stroke-width="1.5"/>
  <line x1="610" y1="151" x2="610" y2="170" stroke="#30363d" stroke-width="1.5"/>
  <line x1="750" y1="151" x2="750" y2="170" stroke="#30363d" stroke-width="1.5"/>

  <!-- 3个状态框并排 -->
  <!-- TRACK -->
  <rect x="440" y="175" width="120" height="95" rx="8" fill="#06140c" stroke="#16c79a" stroke-width="2"/>
  <text x="500" y="195" fill="#16c79a" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">TRACK</text>
  <text x="500" y="212" fill="#8b949e" font-size="10" text-anchor="middle" font-family="sans-serif">灰度巡线 PID</text>
  <text x="500" y="228" fill="#8b949e" font-size="10" text-anchor="middle" font-family="sans-serif">直线正常走</text>
  <text x="500" y="244" fill="#8b949e" font-size="10" text-anchor="middle" font-family="sans-serif">is_corner? → 切</text>

  <!-- CORNER -->
  <rect x="580" y="175" width="120" height="95" rx="8" fill="#1a1206" stroke="#f0a500" stroke-width="2"/>
  <text x="640" y="195" fill="#f0a500" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">CORNER</text>
  <text x="640" y="212" fill="#8b949e" font-size="10" text-anchor="middle" font-family="sans-serif">陀螺仪闭环转90°</text>
  <text x="640" y="228" fill="#8b949e" font-size="10" text-anchor="middle" font-family="sans-serif">灰度丢线 + 恢复</text>

  <!-- STOP -->
  <rect x="720" y="175" width="100" height="95" rx="8" fill="#3d1218" stroke="#e94560" stroke-width="2"/>
  <text x="770" y="195" fill="#e94560" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">STOP</text>
  <text x="770" y="212" fill="#8b949e" font-size="10" text-anchor="middle" font-family="sans-serif">停车</text>
  <text x="770" y="228" fill="#8b949e" font-size="10" text-anchor="middle" font-family="sans-serif">圈数到了</text>

  <!-- 连接线 -->
  <!-- TRACK→CORNER -->
  <line x1="560" y1="222" x2="578" y2="222" stroke="#f0a500" stroke-width="1.5"/>
  <polygon points="578,218 578,226 583,222" fill="#f0a500"/>
  <text x="569" y="216" fill="#f0a500" font-size="9" text-anchor="middle" font-family="sans-serif">→</text>

  <!-- CORNER→TRACK -->
  <line x1="580" y1="238" x2="562" y2="238" stroke="#16c79a" stroke-width="1.5"/>
  <polygon points="562,234 562,242 557,238" fill="#16c79a"/>
  <text x="571" y="252" fill="#16c79a" font-size="9" text-anchor="middle" font-family="sans-serif">→</text>

  <line x1="500" y1="270" x2="770" y2="270" stroke="#e94560" stroke-width="1.5"/>
  <line x1="770" y1="270" x2="770" y2="268" stroke="#e94560" stroke-width="1.5"/>
  <polygon points="766,268 774,268 770,263" fill="#e94560"/>

  <rect x="440" y="322" width="220" height="105" rx="6" fill="#0d1117" stroke="#16c79a" stroke-width="1" stroke-dasharray="3,2"/>

  <rect x="680" y="322" width="200" height="105" rx="6" fill="#0d1117" stroke="#f0a500" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="780" y="340" fill="#f0f6fc" font-size="11" text-anchor="middle" font-family="sans-serif">① 挂起灰度PID</text>
  <text x="780" y="358" fill="#f0f6fc" font-size="11" text-anchor="middle" font-family="sans-serif">② 读取陀螺仪当前航向</text>
  <text x="780" y="376" fill="#f0f6fc" font-size="11" text-anchor="middle" font-family="sans-serif">③ 设定目标=当前+90°</text>
  <text x="780" y="394" fill="#f0f6fc" font-size="11" text-anchor="middle" font-family="sans-serif">④ 陀螺仪PID闭环</text>
  <text x="780" y="412" fill="#f0f6fc" font-size="11" text-anchor="middle" font-family="sans-serif">⑤ 误差收敛 → 切回TRACK</text>

  <rect x="440" y="455" width="360" height="36" rx="8" fill="#0d1117" stroke="#533483" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="620" y="478" fill="#d2a8ff" font-size="12" text-anchor="middle" font-family="sans-serif">task_gimbal() 独立状态机：IDLE / AIM / CIRCLE（独立循环，不阻塞小车）</text>

</svg>

<h2 style="color:#e94560;font-size:20px;margin:40px 0 16px;">图2：调试流程图 — 从零开始，每步测通再往下走</h2>

<svg viewBox="0 0 1000 1150" xmlns="http://www.w3.org/2000/svg" style="max-height:1150px;background:transparent;padding:0;border-radius:0">

  <style>
    .node{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
    .pass{fill:#06140c;stroke:#16c79a;stroke-width:1.5}
    .fail{fill:#3d1218;stroke:#e94560;stroke-width:1.5}
    .text-c{fill:#f0f6fc;font-size:12px;text-anchor:middle;font-family:sans-serif}
    .text-l{fill:#f0f6fc;font-size:12px;font-family:sans-serif}
    .text-s{fill:#8b949e;font-size:10px;text-anchor:middle;font-family:sans-serif}
    .arrow{stroke:#30363d;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    .line{stroke:#30363d;stroke-width:1}
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#30363d"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16c79a"/>
    </marker>
  </defs>

  <!-- 阶段1 -->
  <rect x="30" y="10" width="940" height="160" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="35" fill="#f0a500" font-size="14" font-weight="700" font-family="sans-serif">第1阶段：硬件调试（每个模块单独测通）</text>
  <text x="50" y="52" fill="#8b949e" font-size="11" font-family="sans-serif">⚠ 不要急着跑车。这个阶段最耗时但绝对不能跳。</text>

  <!-- 步骤1-4 -->
  <rect x="50" y="65" width="200" height="48" rx="6" class="node"/>
  <text x="150" y="84" class="text-c" font-weight="600">1. 串口打印</text>
  <text x="150" y="100" class="text-s">bsp_uart_init() → prinf("Hello")</text>
  <text x="50" y="125" class="text-l" fill="#16c79a">✅ 串口助手看到Hello</text>

  <rect x="290" y="65" width="200" height="48" rx="6" class="node"/>
  <text x="390" y="84" class="text-c" font-weight="600">2. 灰度传感器</text>
  <text x="390" y="100" class="text-s">ADC打印8路原始值</text>
  <text x="290" y="125" class="text-l" fill="#16c79a">✅ 黑=低 白=高，每路都对</text>

  <rect x="530" y="65" width="200" height="48" rx="6" class="node"/>
  <text x="630" y="84" class="text-c" font-weight="600">3. 电机PWM</text>
  <text x="630" y="100" class="text-s">左右轮分别正转/反转</text>
  <text x="530" y="125" class="text-l" fill="#16c79a">✅ 车能动，两轮方向一致</text>

  <rect x="770" y="65" width="180" height="48" rx="6" class="node"/>
  <text x="860" y="84" class="text-c" font-weight="600">4. 编码器</text>
  <text x="860" y="100" class="text-s">手推打印计数</text>
  <text x="770" y="125" class="text-l" fill="#16c79a">✅ 正转会增大</text>

  <!-- 箭头连接1-4 -->
  <line x1="250" y1="89" x2="288" y2="89" class="line"/>
  <polygon points="288,86 288,92 293,89" fill="#30363d"/>
  <line x1="490" y1="89" x2="528" y2="89" class="line"/>
  <polygon points="528,86 528,92 533,89" fill="#30363d"/>
  <line x1="730" y1="89" x2="768" y2="89" class="line"/>
  <polygon points="768,86 768,92 773,89" fill="#30363d"/>

  <!-- 阶段2 -->
  <rect x="30" y="190" width="940" height="220" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="215" fill="#f0a500" font-size="14" font-weight="700" font-family="sans-serif">第2阶段：PID调参（先速度环，再位置环）</text>
  <text x="50" y="232" fill="#8b949e" font-size="11" font-family="sans-serif">⚠ 内环先调稳，外环才能工作。顺序错了永远调不好。</text>

  <!-- 5-8 -->
  <rect x="50" y="252" width="280" height="65" rx="6" class="node"/>
  <text x="190" y="274" class="text-c" font-weight="600">5. 速度环PID（开环，不加灰度）</text>
  <text x="190" y="292" class="text-s">给固定BASE_SPEED，编码器测实际速度 → 调SPD_KP/KI</text>
  <text x="50" y="330" class="text-l" fill="#16c79a">✅ 给400实际390~410，推一下车能恢复 → 速度环稳了</text>

  <rect x="370" y="252" width="280" height="65" rx="6" class="node"/>
  <text x="510" y="274" class="text-c" font-weight="600">6. 灰度标定 自适应加权</text>
  <text x="510" y="292" class="text-s">白布→采白值 黑线→采黑值 写入阈值</text>
  <text x="370" y="330" class="text-l" fill="#16c79a">✅ 手动移黑胶带，line_pos从-100平滑变到+100</text>

  <rect x="690" y="252" width="260" height="65" rx="6" class="node"/>
  <text x="820" y="274" class="text-c" font-weight="600">7. 位置环（循迹环）PID</text>
  <text x="820" y="292" class="text-s">打开灰度巡线，调DIR_KP/KD</text>
  <text x="690" y="330" class="text-l" fill="#16c79a">✅ 车在直线上居中微摆，不自激不跑偏</text>

  <!-- 箭头 -->
  <line x1="330" y1="284" x2="368" y2="284" class="line"/>
  <polygon points="368,281 368,287 373,284" fill="#30363d"/>
  <line x1="650" y1="284" x2="688" y2="284" class="line"/>
  <polygon points="688,281 688,287 693,284" fill="#30363d"/>

  <!-- 常见翻车 -->
  <rect x="50" y="360" width="900" height="36" rx="6" fill="#1a0810" stroke="#e94560" stroke-width="1"/>
  <text x="500" y="383" fill="#e94560" font-size="11" text-anchor="middle" font-family="sans-serif">⚠ 常见：极性配反 → 灰度mask是反的，一上赛道就跑飞。先检查bit mask再调PID</text>

  <!-- 阶段3 -->
  <rect x="30" y="430" width="940" height="190" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="455" fill="#f0a500" font-size="14" font-weight="700" font-family="sans-serif">第3阶段：直角弯调试</text>
  <text x="50" y="472" fill="#8b949e" font-size="11" font-family="sans-serif">⚠ 直线跑稳了再上直角弯。直线都没稳就调弯，浪费时间。</text>

  <text x="370" y="560" class="text-l" fill="#16c79a">✅ 转完后回正误差<3°，不超调</text>

  <rect x="690" y="492" width="260" height="55" rx="6" class="node"/>
  <text x="820" y="514" class="text-c" font-weight="600">10. 直角弯联调</text>
  <text x="820" y="532" class="text-s">灰度检测→切转弯→转完后自动恢复巡线</text>
  <text x="690" y="560" class="text-l" fill="#16c79a">✅ 跑一圈，4个直角弯全部过正确</text>

  <polygon points="368,516 368,522 373,519" fill="#30363d"/>
  <line x1="650" y1="519" x2="688" y2="519" class="line"/>

  <rect x="30" y="640" width="940" height="170" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
